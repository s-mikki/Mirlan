<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="../index.css">
</head>
<body class="body">
<div class="body__container">
    <header class="header">
    </header>
    <main class="main">
        <div class="contact">
            <label class="contact__label">
                <input type="search" class="contact__input" placeholder="Поиск товаров" id="contactInput" oninput="contactFilter()">
            </label>
            <ul class="contact__list" id="contactResult">
            </ul>
        </div>
        <div class="todo">
            <h2>Список задач</h2>
            <label class="contact__label">
                <input type="text" class="contact__input" placeholder="Добавить задачу" id="todoInput">
                <button onclick="todo()">Добавить</button>
            </label>
            <ul class="todo-list" id="todoList">
            </ul>
            <div class="todo__controls">
                <button onclick="todoAlls()">Все задачи</button>
                <button onclick="todoActive()">Активные задачи</button>
                <button onclick="todoCompleted()">Завершенные задачи</button>
            </div>
        </div>
    </main>
    <footer class="footer">
        <button onclick="clickButton()">Кликни и появится футер</button>
    </footer>
</div>
<script src="./index.js"></script>
</body>
</html>
