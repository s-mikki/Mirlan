<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../index.css">
</head>
<body class="body">
<div class="body__container">
    <header class="header"></header>
    <main class="main">
        <div class="line">
            <div class="line__circle"></div>
        </div>
        <div class="floor">
            <label class="floor__label">
                <input type="number" class="floor__input" id="floorInput">
                <button class="floor__button" onclick="draw()">Считать</button>
            </label>
            <ul class="floor__list">
                <li class="floor__item--active"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
                <li class="floor__item"></li>
            </ul>
            <p id="floorAnswer"></p>
        </div>
    </main>
    <footer class="footer">
        <button onclick=clickButton()>Кликни и появится футер</button>
    </footer>
</div>
</body>
</html>
