<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../index.css">
</head>
<body class="body">
<div class="body__container">
    <header class="header"></header>
    <main class="main">
        <div class="cream">
            <div class="cream__container">
                <div class="cream__container">
                    <img class="cream__img" src="img/cone-ice.png" alt="крошка">
                </div>
                <img class="softCream__img softCream__img-1" src="img/cream-soft-1.png" width="213" height="331" alt="Крем 1">
                <img class="softCream__img softCream__img-2" src="img/cream-soft-2.png" width="503" height="496" alt="Крем 2">
                <img class="softCream__img softCream__img-3" src="img/cream-soft-3.png" width="288" height="361" alt="Крем 3">
            </div>
            <div class="cream__buttons">
                <button class="cream__button cream__button--1" onclick="cream1()">soft cream 1</button>
                <button class="cream__button cream__button--2" onclick="cream2()">soft cream 2</button>
                <button class="cream__button cream__button--3" onclick="cream3()">soft cream 3</button>
            </div>
        </div>
    </main>
    <footer class="footer" id="footer">
        <button onclick=clickButton()>Кликни и появится футер</button>
    </footer>
</div>
</body>
</html>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
