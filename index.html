<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
<div class="body__container">
    <header class="header"></header>
    <main class="main">
        <div class="percent">
        <div class="percent__block">
            <p>what is</p>
            <input class="percent__input" type="text" id="divisionInp" >%
            <p>of</p>
            <input class="percent__input" type="text" id="divisionInp2">?
        </div>
        <button class="percent__button" onclick="division()">calculate</button>
        <p class="percent__result" id="divisionResult"></p>
        </div>
        <div class="percent">
            <div class="percent__block">
                <input class="percent__input" type="text" id="division2Inp">
                <p>is what Percent of</p>
                <input class="percent__input" type="text" id="division2Inp2">?
            </div>
            <button class="percent__button" onclick="division2()">calculate</button>
            <p class="percent__result" id="divisionResult2"></p>
        </div>
        <div class="percent">
            <div class="percent__block">
                <input class="percent__input" type="text" id="minusInp">
                <p>Minus</p>
                <input class="percent__input" type="text" id="minusInp2">?
            </div>
            <button class="percent__button" onclick="minus()">calculate</button>
            <p class="percent__result" id="minusResult"></p>
        </div>
        <div class="percent">
            <div class="percent__block">
                <input class="percent__input" type="text" id="multiplicationInp">
                <p>Multiply</p>
                <input class="percent__input" type="text" id="multiplicationInp2">?
            </div>
            <button class="percent__button" onclick="multiplication()">calculate*</button>
            <p class="percent__result" id="multiplicationResult"></p>
        </div>
        <div class="meter">
            <div class="meter__container">
                <input type="text" class="meter__input" id="meter">
                <button class="meter__button" onclick="meter()">Метр</button>
            </div>
            <div class="meter__container">
                <input type="text" class="meter__input" id="fud">
                <button class="meter__button" onclick="fud()">Фуд</button>
            </div>
            <div class="meter__container">
                <input type="text" class="meter__input" id="yard">
                <button class="meter__button" onclick="yard()">Ярд</button>
            </div>
        </div>
        <div class="convert">
            <div class="convert__container">
              <div class="convert__block">
                <input type="text" class="convert__input" id="tempInput">
                <select class="convert__select" name="" id="select">
                    <option value="C">C</option>
                    <option value="F">F</option>
                    <option value="K">K</option>
                </select>
            </div>
            <select class="convert__select" name="" id="select2">
                <option value="C">C</option>
                <option value="F">F</option>
                <option value="K">K</option>
            </select>
            <button class="convert__button" onclick=convertTemp()>Конвертировать</button>
            </div>
            <p class="convert__text" id="tempResult"></p>
        </div>
        <div class="count">
            <div class="count__container">
                <div class="count__content">
                    <p class="count__title">Shopping card:</p>
                    <p class="count__number" id="countBox">0</p>
                </div>
                <div class="count__content">
                    <p class="count__title">Total:</p>
                    <p class="count__number" id="sumBox">0</p>
                </div>
            </div>
            <div class="count__block">
                <p class="count__text">Cream</p>
                <div class="count__buttons">
                    <button class="count__button" onclick=countRemove('cream')>remove</button>
                    <button class="count__button" onclick=countAdd('cream')>add</button>
                </div>
            </div>
            <div class="count__block">
                <p class="count__text">water</p>
                <div class="count__buttons">
                    <button class="count__button" onclick=countRemove('water')>remove</button>
                    <button class="count__button" onclick=countAdd('water')>add</button>
                </div>
            </div>
            <div class="count__block">
                <p class="count__text">donut</p>
                <div class="count__buttons">
                    <button class="count__button" onclick=countRemove('donut')>remove</button>
                    <button class="count__button" onclick=countAdd('donut')>add</button>
                </div>
            </div>
        </div>
        <div class="area">
            <label class="area__label">
                <span class="area__text">Площадь комнаты:</span>
                <input type="number" class="area__input" id="areaInput" onclick=areaScore()>
                <span class="area__text">М^2</span>
            </label>
            <label class="area__label">
                <span class="area__text">Желаемый тип пола:</span>
                <select class="area__select" id="areaSelect" onclick=areaScore()>
                    <option class="area__option" value="">---</option>
                    <option class="area__option" value="oak">Дуб</option>
                    <option class="area__option" value="pine">Сосна</option>
                    <option class="area__option" value="cherry">Вишня</option>
                    <option class="area__option" value="birch">Береза</option>
                </select>
            </label>
            <div class="area__label">
                <p class="area__text">Цена:</p>
                <div class="area__score">
                    <p class="area__price" id="areaScore"></p>
                    <p class="area__price">рублей</p>
                </div>
            </div>
            <p class="area__info">Не является публичной афертой</p>
        </div>
        <div class="info">
            <label class="info__label">
                <span>Введите ваше имя:</span>
                <input type="text" class="info__input" id="infoName" onclick=infoNames()>
            </label>
            <label class="info__label">
                <span>Введите возраст:</span>
                <input type="number" class="info__input" id="infoAge" onclick=infoNames()>
            </label>
            <button onclick="infoNames()">вывести</button>
        </div>
        <div class="time">
            <p class="time__text">Время</p>
            <p class="time__numbers" id="time"></p>
        </div>
        <div class="balance" id="balance">
            <div class="balance__block">
                <p class="balance__title" id="balResult"></p>
            </div>
            <div class="balance__container">
                <label class="balance__label">
                    <input type="number" class="balance__input" id="balanceInput">
                </label>
                <button class="balance__button" onclick=balReplenish()>Пополнить</button>
                <button class="balance__button" onclick=balTakeOff()>Снять</button>
                <button class="balance__button" onclick=balRemainder()>Баланс</button>
                <button class="balance__button" onclick=balExit()>Выход</button>
            </div>
        </div>
        <div class="world" id="world">
            <img class="world__img" src="img/img-1.jpg" id="worldImg" alt="Мир">
            <div class="world__texts" id="helloBlock">
            </div>
        </div>
        <div class="traffic">
            <ul class="traffic__list">
                <li class="traffic__item">
                    <div class="traffic__container" id="red"></div>
                </li>
                <li class="traffic__item">
                    <div class="traffic__container" id="yellow"></div>
                </li>
                <li class="traffic__item">
                    <div class="traffic__container" id="green"></div>
                </li>
            </ul>
            <ul class="traffic__list traffic--row">
                <li class="traffic__item">
                    <div class="traffic__container" id="red1"></div>
                </li>
                <li class="traffic__item">
                    <div class="traffic__container" id="yellow1"></div>
                </li>
                <li class="traffic__item">
                    <div class="traffic__container" id="green1"></div>
                </li>
                <li class="traffic__item">
                    <div class="traffic__container" id="white"></div>
                </li>
                <li class="traffic__item">
                    <div class="traffic__container" id="blue"></div>
                </li>
            </ul>
        </div>
        <div class="timer">
            <p class="timer__title">Таймер</p>
            <p class="timer__text" id="timerText">00:01:00</p>
        </div>
        <div class="todo">
            <ul class="todo__list" id="todoList">
            </ul>
            <label class="todo__label">
                <input class="todo__input" type="text" id="todoInput">
                <button class="todo__button" onclick=addTasks()>Add</button>
            </label>
        </div>
    </main>
    <footer class="footer">
        <button onclick="clickButton()">Кликни и появится футер</button>
        <div id="box"></div>
    </footer>
</div>
</body>
</html>
<script src="./index.js"></script>
